name: MGW Cardapio Digital validation

on:
  push:
    branches:
      - main
    paths:
      - 'src/components/DigitalMenuPromoBanners.tsx'
      - 'src/components/PublicMenuView.tsx'
      - 'src/components/DigitalMenuSettingsPanel.tsx'
      - 'supabase/migrations/*cardapio_promo*'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - '.github/workflows/mgw-cardapio-promotions-validation.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'src/components/DigitalMenuPromoBanners.tsx'
      - 'src/components/PublicMenuView.tsx'
      - 'src/components/DigitalMenuSettingsPanel.tsx'
      - 'supabase/migrations/*cardapio_promo*'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - '.github/workflows/mgw-cardapio-promotions-validation.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: TypeScript check
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build
