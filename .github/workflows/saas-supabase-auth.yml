name: MGW Supabase Auth Preview Validation

on:
  push:
    branches:
      - feat/saas-supabase-auth
      - fix/supabase-only-remove-firebase
      - fix/security-hardening-2026-11
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: TypeScript check
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Install admin dependencies
        working-directory: apps/mgw-admin
        run: npm install --no-audit --no-fund
      - name: Admin TypeScript check
        working-directory: apps/mgw-admin
        run: npm run lint
      - name: Admin unit tests
        working-directory: apps/mgw-admin
        run: npm test
      - name: Admin production build
        working-directory: apps/mgw-admin
        run: npm run build
      - name: Production build
        run: npm run build
