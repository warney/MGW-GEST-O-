name: Etapa 3 validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [fix/etapa3-auditoria]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: TypeScript check
        run: npm run lint
      - name: Unit tests
        run: npm run test
      - name: Production build
        run: npm run build
