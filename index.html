    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "MGW Gestão",
        "applicationCategory": "BusinessApplication",
        "operatingSystem": "Web",
        "description": "Sistema de gestão para lanchonetes com vendas, despesas, produtos, combos, categorias, adicionais, relatórios, pedidos online e cardápio digital.",
        "offers": {
          "@type": "Offer",
          "price": "49.90",
          "priceCurrency": "BRL",
          "availability": "https://schema.org/InStock"
        }
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "Preciso instalar algum programa?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Não. O MGW Gestão funciona direto no navegador do computador ou do celular, podendo também ser adicionado como aplicativo PWA."
            }
          },
          {
            "@type": "Question",
            "name": "Meus clientes precisam baixar aplicativo?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Não. Seu cliente abre o Cardápio Digital direto pelo link compartilhado no WhatsApp ou Instagram e envia o pedido pelo navegador."
            }
          },
          {
            "@type": "Question",
            "name": "Como funciona o período de teste?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Ao cadastrar sua lanchonete, você recebe 3 dias gratuitos para testar sem precisar informar cartão de crédito, e depois o plano custa R$ 49,90 por mês."
            }
          }
        ]
      }
